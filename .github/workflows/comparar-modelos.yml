name: comparar-modelos

# Mide modelos aislados (--puro, sin caer a otro) sobre las mismas tareas, para
# ordenar la cadena con datos. Cada modelo va en su propio job porque Groq limita
# por modelo. Los :free de OpenRouter parecen compartir cupo por cuenta: el 2/11/2026,
# en paralelo, entre cuatro midieron 7 corridas. Conviene mandarlos de a uno.
# Se corre a mano: pestaña Actions -> comparar-modelos -> Run workflow.
# No toca el repo: los resultados quedan en el log de cada job.

on:
  workflow_dispatch:
    inputs:
      modelos:
        description: "Lista JSON de modelos"
        type: string
        default: >-
          ["groq/openai/gpt-oss-120b",
          "groq/qwen/qwen3.8-27b",
          "openrouter/cohere/north-mini-code:free"]
      rondas:
        description: "Corridas por tarea"
        type: string
        default: "2"
      tareas:
        description: "Tareas separadas por espacio"
        type: string
        # Las que a veces salen y a veces no, más la 01 de control. Las que pasan
        # o fallan siempre gastarían cupo sin distinguir modelos. El cupo diario
        # de Groq se acaba antes del final: el 2/11/2026 la 28 y la 29 no corrieron.
        default: >-
          01-crear-script 04-refactor 06-test-rojo 07-codebase-bug
          22-bigcodebench-928 25-bigcodebench-310
          28-factura-varias-causas 29-config-con-herencia

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        modelo: ${{ fromJSON(inputs.modelos) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: dependencias
        run: pip install openai

      - name: medir
        timeout-minutes: 225
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELO: ${{ matrix.modelo }}
          RONDAS: ${{ inputs.rondas }}
          TAREAS: ${{ inputs.tareas }}
        run: |
          args=()
          for t in $TAREAS; do args+=(--tarea "$t"); done
          python -u evals/correr_evals.py --puro -m "$MODELO" -r "$RONDAS" --pausa 20 --esperar-cupo \
            --hasta "$(( $(date +%s) + 210 * 60 ))" "${args[@]}"
